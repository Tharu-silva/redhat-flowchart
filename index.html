  #tabs .label { font-weight:700; margin-right:10px; }
  #tabs button.active { background:var(--fg); color:var(--bg); border-color:var(--fg); }

           color:var(--fg); border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--muted); }

  /* sections */

          scroll-margin-top:var(--nav); border-bottom:6px solid var(--border); }
  .view > header { padding:10px 20px; border-bottom:1px solid var(--border); display:flex; gap:16px;

  .view h1 { font-size:18px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  .body { flex:1; display:flex; min-height:0; }
  .viewport { flex:1; overflow:auto; }
  aside { width:310px; padding:16px; overflow:auto; background:var(--panel); border-left:1px solid var(--border); }
  aside h2 { font-size:15px; margin:0 0 4px; }
  aside h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 4px; }
  aside ul { margin:0; padding-left:18px; }
  aside hr { border:0; border-top:1px solid var(--border); margin:16px 0; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; color:#1d1d1b; margin-right:4px; }
  .warn { color:#b25b00; font-size:12px; }
  .legend-row { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px; }
  .swatch { width:16px; height:12px; border-radius:3px; border:1.5px solid #666; flex:none; }
  .swatch.dashed { border-style:dashed; background:transparent; }
  .swatch.pill { border-radius:8px; }
  .line { width:26px; height:0; border-top:2px solid; flex:none; }
  .meta { font-size:11px; color:var(--muted); margin-top:12px; }
  .meta a { color:inherit; }
  .graph .node { cursor:pointer; }
  .graph .node text { fill:#1d1d1b; pointer-events:none; }
  .graph .node.sel rect { stroke-width:3.5; }
  .graph .dim { opacity:.15; }
  .graph .edge path { transition: opacity .15s; }
  .graph .edge-label { fill:var(--fg); font-size:11px; paint-order:stroke; stroke:var(--bg); stroke-width:4px; }
  .error { margin:40px; padding:20px; border:1px solid #c0392b; border-radius:8px; max-width:640px; }
  @media (max-width:800px) {
    .body { flex-direction:column; }
    aside { width:auto; max-height:45%; border-left:0; border-top:1px solid var(--border); }

</style>

<!-- ===================== APPLICATION LOGIC ===================== -->
<script>
const NODE_W = 190, NODE_H = 50, DUMMY_H = 14, COL_GAP = 90, ROW_GAP = 16, PAD = 40;
const q = (root, sel) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- layout: layered DAG (longest-path layering + dummy nodes + barycenter ordering) ---------- */
function computeLayout(g, S) {
  const nodes = new Map(g.nodes.map(n => [n.id, n]));
  const preds = new Map(), succs = new Map();
  nodes.forEach((_, id) => { preds.set(id, []); succs.set(id, []); });
  for (const e of g.edges) {
    if (!nodes.has(e.from) || !nodes.has(e.to)) throw new Error(`Edge references unknown node: ${e.from} → ${e.to}`);
    if (!S.edgeTypes[e.type]) throw new Error(`Unknown edge type "${e.type}"`);
    preds.get(e.to).push(e.from); succs.get(e.from).push(e.to);
  }
  for (const n of g.nodes) {
    if (!S.levels[n.level]) throw new Error(`Node "${n.id}" has unknown level "${n.level}"`);
    if (!S.nodeTypes[n.type]) throw new Error(`Node "${n.id}" has unknown type "${n.type}"`);
  }

  // 1. longest-path layering (Kahn); detects cycles
  const layer = new Map(), indeg = new Map(), queue = [];
  nodes.forEach((_, id) => { indeg.set(id, preds.get(id).length); layer.set(id, 0); if (!indeg.get(id)) queue.push(id); });
  let seen = 0;
  while (queue.length) {
    const id = queue.shift(); seen++;
    for (const s of succs.get(id)) {
      layer.set(s, Math.max(layer.get(s), layer.get(id) + 1));
      indeg.set(s, indeg.get(s) - 1);
      if (!indeg.get(s)) queue.push(s);
    }
  }
  if (seen !== nodes.size) throw new Error('The graph contains a cycle; prerequisites must form a DAG.');
  // pull source nodes right next to their earliest successor so they don't float far left
  nodes.forEach((_, id) => {
    if (!preds.get(id).length && succs.get(id).length)
      layer.set(id, Math.min(...succs.get(id).map(s => layer.get(s))) - 1);
  });

  // 2. dummy nodes for edges that span multiple layers
  const items = new Map();
  nodes.forEach((n, id) => items.set(id, { key: id, node: n, layer: layer.get(id), dummy: false, up: [], down: [] }));
  const chains = g.edges.map((e, ei) => {
    const keys = [e.from];
    for (let l = layer.get(e.from) + 1; l < layer.get(e.to); l++) {
      const k = `d:${ei}:${l}`;
      items.set(k, { key: k, layer: l, dummy: true, up: [], down: [] });
      keys.push(k);
    }
    keys.push(e.to);
    for (let i = 0; i < keys.length - 1; i++) { items.get(keys[i]).down.push(keys[i + 1]); items.get(keys[i + 1]).up.push(keys[i]); }
    return keys;
  });

  // 3. order within columns (barycenter sweeps)
  const maxLayer = Math.max(...[...items.values()].map(i => i.layer));
  const cols = Array.from({ length: maxLayer + 1 }, () => []);
  items.forEach(it => cols[it.layer].push(it));
  cols.forEach(c => c.sort((a, b) => a.dummy - b.dummy));
  const setPos = () => cols.forEach(c => c.forEach((it, i) => it.pos = i));
  setPos();
  for (let pass = 0; pass < 4; pass++) {
    const down = pass % 2 === 0;
    const seq = down ? cols.slice(1) : cols.slice(0, -1).reverse();
    for (const c of seq) {
      c.forEach(it => {
        const nb = (down ? it.up : it.down).map(k => items.get(k).pos);
        it.bary = nb.length ? nb.reduce((a, b) => a + b) / nb.length : it.pos;
      });
      c.sort((a, b) => a.bary - b.bary);
      setPos();
    }
  }

  // 4. coordinates
  const colH = cols.map(c => c.reduce((s, it) => s + (it.dummy ? DUMMY_H : NODE_H), 0) + ROW_GAP * (c.length - 1));
  const maxH = Math.max(...colH);
  cols.forEach((c, li) => {
    let y = PAD + (maxH - colH[li]) / 2;
    const x = PAD + li * (NODE_W + COL_GAP);
    c.forEach(it => {
      it.x = x; it.y = y; it.h = it.dummy ? DUMMY_H : NODE_H;
      it.cx = x + NODE_W / 2; it.cy = y + it.h / 2;
      y += it.h + ROW_GAP;
    });
  });

  // 5. edge paths (smooth curves with horizontal tangents through dummy points)
  const edgePaths = chains.map(keys => {
    const pts = keys.map((k, i) => {
      const it = items.get(k);
      if (it.dummy) return { x: it.cx, y: it.cy };
      return i === 0 ? { x: it.x + NODE_W, y: it.cy } : { x: it.x, y: it.cy };
    });
    let path = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const mx = (pts[i - 1].x + pts[i].x) / 2;
      path += ` C${mx},${pts[i - 1].y} ${mx},${pts[i].y} ${pts[i].x},${pts[i].y}`;
    }
    const a = pts[pts.length - 2], b = pts[pts.length - 1];
    return { d: path, lx: (a.x + b.x) / 2, ly: (a.y + b.y) / 2 - 4 };
  });

  return { items, edgePaths,
    width: PAD * 2 + (maxLayer + 1) * NODE_W + maxLayer * COL_GAP,
    height: PAD * 2 + maxH };
}

/* ---------- one self-contained view per graph ---------- */
class GraphView {
  constructor(S, g, host) {
    this.S = S; this.g = g;
    this.state = { selected: null, hidden: new Set(), scale: 1 };

    this.root = document.createElement('section');
    this.root.className = 'view';
    this.root.id = 'view-' + g.id;
    this.root.innerHTML = `
      <header>
        <div><h1></h1><div class="sub subtitle"></div></div>
        <div><button class="zout" title="Zoom out">−</button> <button class="zfit" title="Fit to width">Fit</button> <button class="zin" title="Zoom in">+</button></div>
      </header>
      <div class="body">
        <div class="viewport"><svg class="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <aside>
          <div class="details"></div><hr><div class="legend"></div><div class="meta"></div>
        </aside>
      </div>`;
    host.appendChild(this.root);

    try { this.L = computeLayout(g, S); }
    catch (err) {
      q(this.root, 'h1').textContent = g.meta?.title || g.id;
      q(this.root, '.viewport').innerHTML = `<div class="error"><strong>${esc(err.message)}</strong></div>`;
      return;
    }
    this.renderChrome();
    this.renderGraph();
    this.resetDetails();
    this.fit();
    q(this.root, '.zin').onclick  = () => this.setScale(this.state.scale * 1.2);
    q(this.root, '.zout').onclick = () => this.setScale(this.state.scale / 1.2);
    q(this.root, '.zfit').onclick = () => this.fit();
  }

  renderChrome() {
    const { S, g, root } = this, m = g.meta || {};
    q(root, 'h1').textContent = m.title || g.id;
    q(root, '.subtitle').textContent = [m.subtitle, m.asOf && `as of ${m.asOf}`].filter(Boolean).join(' · ');

    // legend: shared styles, but only entries that appear in this graph
    const usedLevels = new Set(g.nodes.map(n => n.level));
    const usedTypes  = new Set(g.nodes.map(n => n.type));
    const usedEdges  = new Set(g.edges.map(e => e.type));
    let h = '<h3>Levels</h3>';
    for (const [k, lv] of Object.entries(S.levels)) if (usedLevels.has(k))
      h += `<div class="legend-row"><span class="swatch" style="background:${lv.color}"></span>${esc(lv.label)}</div>`;
    h += '<h3>Nodes</h3>';
    for (const [k, t] of Object.entries(S.nodeTypes)) if (usedTypes.has(k))
      h += `<div class="legend-row"><span class="swatch ${t.dashed ? 'dashed' : ''} ${t.shape === 'pill' ? 'pill' : ''}"></span>${esc(t.label)}</div>`;
    if (g.nodes.some(n => n.flag))
      h += `<div class="legend-row"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#f0a030"/><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#1d1d1b">!</text></svg>Needs checking (see details)</div>`;
    h += '<h3>Edges (toggle)</h3>';
    for (const [k, t] of Object.entries(S.edgeTypes)) if (usedEdges.has(k))
      h += `<label class="legend-row"><input type="checkbox" data-edge="${k}" checked>
            <span class="line" style="border-color:${t.color};border-top-style:${t.dash ? 'dashed' : 'solid'}"></span>${esc(t.label)}</label>`;
    q(root, '.legend').innerHTML = h;

    q(root, '.meta').innerHTML = (m.disclaimer ? `<p>${esc(m.disclaimer)}</p>` : '') +
      (m.sources?.length ? '<div>Sources:</div><ul>' + m.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('') + '</ul>' : '');

    q(root, '.legend').addEventListener('change', e => {
      const k = e.target.dataset.edge; if (!k) return;
      e.target.checked ? this.state.hidden.delete(k) : this.state.hidden.add(k);
      root.querySelectorAll(`.edge[data-type="${k}"]`).forEach(el => el.style.display = e.target.checked ? '' : 'none');
      this.highlight(this.state.selected);
    });
  }

  renderGraph() {
    const { S, g, L, root } = this, svg = q(root, '.graph'), gid = g.id;
    svg.setAttribute('viewBox', `0 0 ${L.width} ${L.height}`);
    let h = '<defs>';
    for (const [k, t] of Object.entries(S.edgeTypes))
      h += `<marker id="arrow-${gid}-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="${t.color}"/></marker>`;
    h += '</defs><g>';
    g.edges.forEach((e, i) => {
      const t = S.edgeTypes[e.type], p = L.edgePaths[i];
      h += `<g class="edge" data-i="${i}" data-type="${e.type}">
        <path d="${p.d}" fill="none" stroke="${t.color}" stroke-width="${t.width}" ${t.dash ? `stroke-dasharray="${t.dash}"` : ''} marker-end="url(#arrow-${gid}-${e.type})"/>
        ${e.label ? `<text class="edge-label" x="${p.lx}" y="${p.ly}" text-anchor="middle">${esc(e.label)}</text>` : ''}
      </g>`;
    });
    h += '</g><g>';
    g.nodes.forEach(n => {
      const it = L.items.get(n.id), nt = S.nodeTypes[n.type], lv = S.levels[n.level];
      const course = n.type === 'course';
      const fill = course ? 'var(--panel)' : lv.color;
      const rx = nt.shape === 'pill' ? NODE_H / 2 : 8;
      h += `<g class="node" data-id="${esc(n.id)}" transform="translate(${it.x},${it.y})">
        <rect width="${NODE_W}" height="${NODE_H}" rx="${rx}" fill="${fill}" stroke="${nt.shape === 'pill' ? '#444' : '#777'}" stroke-width="${nt.shape === 'pill' ? 2 : 1.5}" ${nt.dashed ? 'stroke-dasharray="5 3"' : ''}/>
        ${course ? `<rect width="6" height="${NODE_H}" rx="3" fill="${lv.color}" stroke="#777" stroke-width="1"/>` : ''}
        <text x="${NODE_W / 2}" y="${n.sublabel ? 21 : 30}" text-anchor="middle" font-size="13" font-weight="700" ${course ? 'style="fill:var(--fg)"' : ''}>${esc(n.label)}</text>
        ${n.sublabel ? `<text x="${NODE_W / 2}" y="37" text-anchor="middle" font-size="11" ${course ? 'style="fill:var(--muted)"' : ''}>${esc(n.sublabel)}</text>` : ''}
        ${n.flag ? `<g><circle cx="${NODE_W - 8}" cy="8" r="7" fill="#f0a030"/><text x="${NODE_W - 8}" y="12" text-anchor="middle" font-size="11" font-weight="700" style="fill:#1d1d1b">!</text><title>${esc(n.flag)}</title></g>` : ''}
      </g>`;
    });
    svg.innerHTML = h + '</g>';

    svg.addEventListener('mouseover', e => { const n = e.target.closest('.node'); if (n) this.highlight(n.dataset.id); });
    svg.addEventListener('mouseout',  e => { if (e.target.closest('.node')) this.highlight(this.state.selected); });
    svg.addEventListener('click', e => {
      const n = e.target.closest('.node');
      this.select(n && n.dataset.id !== this.state.selected ? n.dataset.id : null);
    });
  }

  reach(start, dir) {                    // nodes reachable from start via visible edges
    const out = new Set([start]), stack = [start];
    while (stack.length) {
      const id = stack.pop();
      for (const e of this.g.edges) {
        if (this.state.hidden.has(e.type)) continue;
        const [a, b] = dir === 'down' ? [e.from, e.to] : [e.to, e.from];
        if (a === id && !out.has(b)) { out.add(b); stack.push(b); }
      }
    }
    return out;
  }

  highlight(id) {
    const nodeEls = this.root.querySelectorAll('.node'), edgeEls = this.root.querySelectorAll('.edge');
    if (!id) { [...nodeEls, ...edgeEls].forEach(el => el.classList.remove('dim')); return; }
    const anc = this.reach(id, 'up'), desc = this.reach(id, 'down');
    nodeEls.forEach(el => el.classList.toggle('dim', !anc.has(el.dataset.id) && !desc.has(el.dataset.id)));
    edgeEls.forEach(el => {
      const e = this.g.edges[el.dataset.i];
      const on = (anc.has(e.from) && anc.has(e.to)) || (desc.has(e.from) && desc.has(e.to));
      el.classList.toggle('dim', !on);
    });
  }

  resetDetails() {
    q(this.root, '.details').innerHTML = '<span class="sub">Hover a node to trace its prerequisites and what it leads to. Click for details.</span>';
  }

  select(id) {
    const { S, g } = this;
    this.state.selected = id;
    this.root.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
    this.highlight(id);
    if (!id) { this.resetDetails(); return; }
    const n = g.nodes.find(x => x.id === id), lv = S.levels[n.level], nt = S.nodeTypes[n.type];
    const label = nid => { const m = g.nodes.find(x => x.id === nid); return `${esc(m.label)} <span class="sub">${esc(m.sublabel || '')}</span>`; };
    const incoming = g.edges.filter(e => e.to === id), outgoing = g.edges.filter(e => e.from === id);
    const list = (title, arr, key) => arr.length ? `<h3>${title}</h3><ul>${arr.map(e => `<li>${label(e[key])} <span class="sub">(${esc(S.edgeTypes[e.type].label.toLowerCase())}${e.label ? ' · ' + esc(e.label) : ''})</span></li>`).join('')}</ul>` : '';
    q(this.root, '.details').innerHTML = `<h2>${esc(n.title || n.label)}</h2>
      <span class="badge" style="background:${lv.color}">${esc(lv.label)}</span><span class="badge" style="background:var(--border)">${esc(nt.label)}</span>
      <p>${esc(n.description || '')}</p>
      ${n.flag ? `<p class="warn">⚠ ${esc(n.flag)}</p>` : ''}
      ${list('Comes from', incoming, 'from')}${list('Leads to', outgoing, 'to')}`;
  }

  setScale(s) {
    this.state.scale = Math.min(2, Math.max(0.3, s));
    const svg = q(this.root, '.graph');
    svg.setAttribute('width', this.L.width * this.state.scale);
    svg.setAttribute('height', this.L.height * this.state.scale);
  }
  fit() { this.setScale(Math.max(0.55, Math.min(1, (q(this.root, '.viewport').clientWidth - 20) / this.L.width))); }
}

/* ---------- bootstrap: sections + sticky tab bar ---------- */
(function init() {
  let data;
  try { data = JSON.parse(document.getElementById('graph-data').textContent); }
  catch (err) { document.getElementById('sections').innerHTML = `<div class="error"><strong>${esc(err.message)}</strong></div>`; return; }

  const host = document.getElementById('sections'), nav = document.getElementById('tabs');
  const views = data.graphs.map(g => new GraphView(data.styles, g, host));

  const buttons = data.graphs.map((g, i) => {
    const b = document.createElement('button');
    b.textContent = g.tab || g.id;
    b.onclick = () => views[i].root.scrollIntoView({ behavior: 'smooth' });
    nav.appendChild(b);
    return b;
  });

  const setActive = i => buttons.forEach((b, j) => b.classList.toggle('active', i === j));
  setActive(0);
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) setActive(views.findIndex(v => v.root === en.target)); });
  }, { threshold: 0.5 });
  views.forEach(v => io.observe(v.root));
})();
</script>
